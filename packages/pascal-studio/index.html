<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pascal 3D Studio</title>
    <script>
      window.process = window.process || { env: { NODE_ENV: 'development' } };
      window.addEventListener('error', function(e) {
        var b = document.getElementById('studio-global-error-banner');
        if (!b) {
          b = document.createElement('div');
          b.id = 'studio-global-error-banner';
          b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#b91c1c;color:#ffffff;padding:12px 16px;font-family:monospace;font-size:12px;white-space:pre-wrap;box-shadow:0 4px 6px rgba(0,0,0,0.4);border-bottom:2px solid #f87171;';
          b.textContent = '[Pascal Studio Script Error]\n' + (e.error ? (e.error.stack || e.error.message) : e.message);
          document.body ? document.body.appendChild(b) : document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(b); });
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var b = document.getElementById('studio-global-error-banner');
        if (!b) {
          b = document.createElement('div');
          b.id = 'studio-global-error-banner';
          b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#b91c1c;color:#ffffff;padding:12px 16px;font-family:monospace;font-size:12px;white-space:pre-wrap;box-shadow:0 4px 6px rgba(0,0,0,0.4);border-bottom:2px solid #f87171;';
          b.textContent = '[Pascal Studio Unhandled Rejection]\n' + (e.reason ? (e.reason.stack || e.reason.message) : e.reason);
          document.body ? document.body.appendChild(b) : document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(b); });
        }
      });
    </script>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
